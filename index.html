<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delibal FM</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#111;
  color:#ccc;
  text-align:center;
  padding:40px 15px;
  margin:0;
}

h1{
  font-size:3em;
  color:#fff;
  margin-bottom:10px;
}

.player-wrapper{
  max-width:480px;
  margin:30px auto;
  background:#222;
  padding:25px;
  border-radius:15px;
  box-shadow:0 0 25px rgba(233,0,90,.6);
}

.play-btn{
  cursor:pointer;
  margin-bottom:20px;
}

.play-btn svg{
  width:60px;
  height:60px;
  fill:#e9005a;
  transition:.2s;
}

.play-btn:hover svg{
  transform:scale(1.2);
}

.volume-slider{
  width:80%;
  margin-top:15px;
  accent-color:#e9005a;
}

.live{
  margin-top:20px;
  font-weight:bold;
  color:#0f0;
}

audio{display:none;}
</style>
</head>

<body>

<h1>Delibal FM</h1>
<p>Canlı Yayın</p>

<div class="player-wrapper">

  <div class="play-btn" id="playBtn">
    <svg id="icon" viewBox="0 0 24 24">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </div>

  <input type="range" min="0" max="1" step="0.01" value="1" id="volume" class="volume-slider">

  <div class="live">🔴 CANLI YAYIN</div>

  <audio id="radio" preload="none" crossorigin="anonymous">
    <source src="https://radyoserver1.okeylisans.com:8030/;" type="audio/mpeg">
  </audio>

</div>

<script>
const radio = document.getElementById("radio");
const playBtn = document.getElementById("playBtn");
const icon = document.getElementById("icon");
const volume = document.getElementById("volume");

let playing = false;

playBtn.onclick = () => {
  if(!playing){
    radio.play().then(()=>{
      icon.innerHTML = '<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>';
      playing = true;
    }).catch(err=>{
      alert("Yayın başlatılamadı. Sunucu HTML5 uyumlu olmayabilir.");
      console.error(err);
    });
  }else{
    radio.pause();
    icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    playing = false;
  }
};

volume.oninput = e => {
  radio.volume = e.target.value;
};
</script>

</body>
</html>
