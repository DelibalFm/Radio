<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delibal FM</title>
<style>
  body {
    font-family: 'Arial', sans-serif;
    background-color: #111; /* Mat siyah */
    color: #ccc;
    text-align: center;
    padding: 50px 20px;
  }

  /* Başlık */
  h1 {
    font-size: 3em; /* Büyük yazı */
    color: #999; /* Soluk ama belirgin */
    margin-bottom: 10px;
  }

  h1 span {
    font-size: 1.5em;
  }

  /* Alt yazı */
  p {
    font-size: 1.2em;
    color: #bbb;
    margin-bottom: 30px;
  }

  /* Modern Player */
  .player-wrapper {
    position: relative;
    display: inline-block;
    width: 90%;
    max-width: 500px;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    background: #222;
  }

  audio {
    width: 100%;
    outline: none;
    display: block;
  }

  /* Hover efekti */
  .player-wrapper:hover {
    box-shadow: 0 0 25px #e9005a;
    transform: scale(1.02);
    transition: 0.3s;
  }

  /* Canlı gösterge */
  .live-indicator {
    margin-top: 15px;
    display: inline-flex;
    align-items: center;
    font-size: 1.2em;
    font-weight: bold;
    color: red; /* yazısı kırmızı */
  }

  .live-dot {
    width: 15px;
    height: 15px;
    background-color: #0f0; /* yeşil yanıp sönen yuvarlak */
    border-radius: 50%;
    margin-right: 10px;
    animation: blink 1s infinite;
  }

  @keyframes blink {
    0%, 50%, 100% { opacity: 1; }
    25%, 75% { opacity: 0; }
  }

  @media (max-width: 600px) {
    h1 { font-size: 2.2em; }
    p { font-size: 1em; }
  }
</style>
</head>
<body>

<h1>🎵 Delibal FM</h1>
<p>Canlı Yayını Dinlemek İçin Play Tuşuna Basın:</p>

<div class="player-wrapper">
  <audio controls>
    <source src="https://radyoserver1.okeylisans.com:8030/live.mp3" type="audio/mpeg">
    Tarayıcınız audio elementini desteklemiyor.
  </audio>
</div>

<div class="live-indicator">
  <div class="live-dot"></div>
  Canlı Yayın
</div>

</body>
</html>
