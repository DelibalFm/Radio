<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Delibal FM | Canlı Radyo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Delibal FM - Canlı Radyo Yayını">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      text-align: center;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(8px);
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: 1px;
    }

    header p {
      opacity: 0.8;
      margin-top: 5px;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .player-box {
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .player-box h2 {
      font-weight: 500;
      margin-bottom: 15px;
    }

    .live {
      color: #00ff9d;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    button {
      background: #00ff9d;
      border: none;
      border-radius: 50px;
      padding: 15px 30px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      color: #000;
    }

    button:hover {
      transform: scale(1.05);
      background: #00d987;
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 0.85rem;
      opacity: 0.7;
    }

    @media (max-width: 480px) {
      header h1 {
        font-size: 1.7rem;
      }

      .player-box {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Delibal FM</h1>
  <p>Canlı Radyo Yayını</p>
</header>

<main>
  <div class="player-box">
    <h2>Şimdi Yayında</h2>
    <div class="live">🔴 CANLI YAYIN</div>

    <audio id="radio" src="https://radyoserver1.okeylisans.com:8030/;"></audio>

    <div class="controls">
      <button onclick="playRadio()">▶ Play</button>
      <button onclick="pauseRadio()">⏸ Pause</button>
    </div>
  </div>
</main>

<footer>
  © 2026 Delibal FM • Tüm Hakları Saklıdır
</footer>

<script>
  const radio = document.getElementById("radio");

  function playRadio() {
    radio.play();
  }

  function pauseRadio() {
    radio.pause();
  }
</script>

</body>
</html>
