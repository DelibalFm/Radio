<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delibal FM • Canlı Yayın</title>

<style>
:root{
  --pink:#ff4fd8;
  --purple:#7a4cff;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at top, #24104a, #05010a 70%);
  font-family:'Segoe UI',sans-serif;
  color:#eee;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.player{
  width:100%;
  max-width:420px;
  background:linear-gradient(180deg,#1a0f2e,#10071e);
  border-radius:26px;
  padding:30px 26px 26px;
  text-align:center;
  position:relative;
  box-shadow:
    0 0 40px rgba(255,79,216,.25),
    0 0 80px rgba(122,76,255,.15);
}

.player::before{
  content:'';
  position:absolute;
  inset:-2px;
  border-radius:28px;
  background:linear-gradient(135deg,var(--pink),var(--purple));
  filter:blur(14px);
  opacity:.35;
  z-index:-1;
}

h1{
  margin:0 0 6px;
  font-size:2.3em;
  color:#fff;
  text-shadow:0 0 15px rgba(255,79,216,.6);
}

.subtitle{
  opacity:.8;
  font-size:.95em;
  margin-bottom:16px;
}

/* LIVE */
.live{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-size:1em;
  font-weight:800;
}

.live-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--pink),var(--purple));
  box-shadow:0 0 10px var(--pink),0 0 18px var(--purple);
  animation:pulse 1.2s infinite;
}

.dj-gradient{
  background:linear-gradient(90deg,var(--pink),var(--purple));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:
    0 0 6px rgba(255,79,216,.9),
    0 0 16px rgba(122,76,255,.7);
}

/* SONG */
.song-wrap{
  margin:12px 0 18px;
  overflow:hidden;
  white-space:nowrap;
}

.song-text{
  display:inline-block;
  padding-left:100%;
  animation:scroll 15s linear infinite;
  font-size:.95em;
  font-weight:600;
}

.song-prefix{
  margin-right:12px;
  background:linear-gradient(90deg,var(--pink),var(--purple));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  font-weight:800;
}

.song-name{
  background:linear-gradient(90deg,#fff,var(--pink));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

@keyframes scroll{
  from{transform:translateX(0)}
  to{transform:translateX(-100%)}
}

/* PLAY */
.play-btn{
  width:96px;
  height:96px;
  border-radius:50%;
  margin:0 auto 22px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  background:linear-gradient(135deg,var(--pink),var(--purple));
  box-shadow:
    0 0 25px rgba(255,79,216,.7),
    inset 0 0 12px rgba(255,255,255,.25);
  transition:.25s;
}

.play-btn:hover{transform:scale(1.08)}
.play-btn svg{width:42px;height:42px;fill:#12061f}

/* VOLUME */
.volume label{
  display:block;
  font-size:.85em;
  opacity:.7;
  margin-bottom:6px;
}
.volume input{
  width:100%;
  accent-color:var(--pink);
}

.footer{
  margin-top:16px;
  font-size:.7em;
  opacity:.45;
}

@keyframes pulse{
  0%{opacity:1}
  50%{opacity:.35}
  100%{opacity:1}
}

audio{display:none}
</style>
</head>

<body>

<div class="player">

  <h1>Delibal FM</h1>
  <div class="subtitle">Canlı Radyo Yayını</div>

  <!-- LIVE -->
  <div class="live">
    <div class="live-dot"></div>
    <span id="djName" class="dj-gradient">Yükleniyor...</span>
    <span class="dj-gradient">YAYINDA !</span>
  </div>

  <!-- SONG -->
  <div class="song-wrap">
    <div class="song-text">
      <span class="song-prefix">♫ ŞU AN ÇALAN ŞARKI:</span>
      <span id="songTitle" class="song-name">Yükleniyor...</span>
    </div>
  </div>

  <!-- PLAY -->
  <div class="play-btn" id="playBtn">
    <svg id="icon" viewBox="0 0 24 24">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </div>

  <div class="volume">
    <label>Ses Seviyesi</label>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
  </div>

  <div class="footer">
    © 2026 Delibal FM • Tüm yayın hakları saklıdır.
  </div>

  <audio id="radio">
    <source src="https://radyoserver1.okeylisans.com:8030/live.mp3" type="audio/mpeg">
  </audio>

</div>

<script>
const radio = document.getElementById("radio");
const playBtn = document.getElementById("playBtn");
const icon = document.getElementById("icon");
const volume = document.getElementById("volume");
const songTitle = document.getElementById("songTitle");
const djName = document.getElementById("djName");

let playing = false;

/* PLAY */
playBtn.onclick = () => {
  if(!playing){
    radio.play();
    icon.innerHTML =
      '<rect x="6" y="5" width="4" height="14"/>' +
      '<rect x="14" y="5" width="4" height="14"/>';
    playing = true;
  }else{
    radio.pause();
    icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    playing = false;
  }
};

volume.oninput = e => radio.volume = e.target.value;

/* DJ TXT */
async function loadDJ(){
  try{
    const res = await fetch("dj.txt?cache=" + Date.now());
    djName.innerText = (await res.text()).trim();
  }catch{
    djName.innerText = "Delibal FM";
  }
}

/* SHOUTcast SONG */
async function loadSong(){
  try{
    const url =
      "https://api.allorigins.win/raw?url=" +
      encodeURIComponent(
        "https://radyoserver1.okeylisans.com:8030/stats?json=1"
      );

    const res = await fetch(url,{cache:"no-store"});
    const data = await res.json();

    songTitle.innerText =
      data.songtitle ||
      data.streams?.[0]?.songtitle ||
      "Şarkı bilgisi yok";

  }catch{
    songTitle.innerText = "Şarkı bilgisi alınamadı";
  }
}

loadDJ();
loadSong();
setInterval(loadDJ,5000);
setInterval(loadSong,5000);
</script>

</body>
</html
