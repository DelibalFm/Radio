<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delibal FM</title>
<style>
  body {
    font-family: 'Arial', sans-serif;
    background-color: #111; /* Mat siyah */
    color: #ccc;
    text-align: center;
    padding: 50px 20px;
  }

  h1 {
    font-size: 3em;
    color: #999;
    margin-bottom: 10px;
  }

  p {
    font-size: 1.2em;
    color: #bbb;
    margin-bottom: 30px;
  }

  /* Player Çerçevesi */
  .player-wrapper {
    position: relative;
    display: inline-block;
    width: 90%;
    max-width: 500px;
    background: #222;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    margin-bottom: 15px;
  }

  /* Oynat/Durdur Butonu */
  .play-btn {
    display: inline-block;
    font-size: 2em;
    color: #e9005a;
    cursor: pointer;
    user-select: none;
    transition: transform 0.2s, color 0.2s;
    margin-bottom: 15px;
  }

  .play-btn:hover {
    transform: scale(1.3);
    color: #ff4f9c;
  }

  /* Audio element gizli */
  audio {
    display: none;
  }

  /* Progress Bar */
  .progress-container {
    width: 100%;
    height: 8px;
    background: #444;
    border-radius: 4px;
    cursor: pointer;
    margin-bottom: 15px;
  }

  .progress {
    width: 0%;
    height: 100%;
    background: #e9005a;
    border-radius: 4px;
    transition: width 0.2s;
  }

  /* Ses kontrol */
  .volume-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 15px;
  }

  .volume-slider {
    width: 70%;
    cursor: pointer;
  }

  /* Canlı gösterge */
  .live-indicator {
    display: flex;
    flex-direction: column; /* yazı her zaman altında */
    align-items: center;
    font-size: 1.2em;
    font-weight: bold;
  }

  .live-dot {
    width: 15px;
    height: 15px;
    background-color: #0f0;
    border-radius: 50%;
    animation: blink 1s infinite;
    margin-bottom: 5px;
  }

  .live-text {
    color: red;
  }

  @keyframes blink {
    0%, 50%, 100% { opacity: 1; }
    25%, 75% { opacity: 0; }
  }

  @media (max-width: 600px) {
    h1 { font-size: 2.2em; }
    p { font-size: 1em; }
    .play-btn { font-size: 1.8em; }
  }
</style>
</head>
<body>

<h1>🎵 Delibal FM</h1>
<p>Canlı Yayını Dinlemek İçin Play Tuşuna Basın:</p>

<div class="player-wrapper">
  <div class="play-btn" id="playBtn">▶️</div>
  
  <div class="progress-container" id="progressContainer">
    <div class="progress" id="progress"></div>
  </div>

  <div class="volume-container">
    Ses: <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="1">
  </div>

  <audio id="radioAudio">
    <source src="https://radyoserver1.okeylisans.com:8030/live.mp3" type="audio/mpeg">
    Tarayıcınız audio elementini desteklemiyor.
  </audio>
</div>

<div class="live-indicator">
  <div class="live-dot"></div>
  <div class="live-text">Canlı Yayın</div>
</div>

<script>
  const playBtn = document.getElementById('playBtn');
  const radioAudio = document.getElementById('radioAudio');
  const progress = document.getElementById('progress');
  const progressContainer = document.getElementById('progressContainer');
  const volumeSlider = document.getElementById('volumeSlider');
  let playing = false;

  // Oynat / Durdur
  playBtn.addEventListener('click', () => {
    if (!playing) {
      radioAudio.play();
      playBtn.textContent = '⏸️';
    } else {
      radioAudio.pause();
      playBtn.textContent = '▶️';
    }
    playing = !playing;
  });

  // Progress bar güncelleme
  radioAudio.addEventListener('timeupdate', () => {
    const progressPercent = (radioAudio.currentTime / radioAudio.duration) * 100;
    if (!isNaN(progressPercent)) progress.style.width = `${progressPercent}%`;
  });

  // Progress bar tıklama ile seek
  progressContainer.addEventListener('click', (e) => {
    const width = progressContainer.clientWidth;
    const clickX = e.offsetX;
    const duration = radioAudio.duration;
    if (!isNaN(duration)) radioAudio.currentTime = (clickX / width) * duration;
  });

  // Ses kontrolü
  volumeSlider.addEventListener('input', (e) => {
    radioAudio.volume = e.target.value;
  });
</script>

</body>
</html>
