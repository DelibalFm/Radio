<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delibal FM</title>
<style>
body {
  font-family: 'Arial', sans-serif;
  background-color: #111;
  color: #ccc;
  text-align: center;
  padding: 50px 20px;
}

/* Başlık: Parlayan ışık animasyonu */
h1 {
  font-size: 3em;
  color: #fff; 
  margin-bottom: 10px;
  position: relative;
  display: inline-block;
}

h1::after {
  content: '';
  position: absolute;
  top: -5px; left: -5px;
  width: 100%; height: 100%;
  border-radius: 8px;
  box-shadow: 0 0 20px #fff, 0 0 30px #fff, 0 0 40px #fff;
  animation: glow 1.5s infinite alternate;
  z-index: -1;
}

@keyframes glow {
  0% { box-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px #fff; }
  50% { box-shadow: 0 0 20px #fff, 0 0 25px #fff, 0 0 30px #fff; }
  100% { box-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px #fff; }
}

p {
  font-size: 1.2em;
  color: #bbb;
  margin-bottom: 30px;
}

/* Player Çerçevesi */
.player-wrapper {
  position: relative;
  display: inline-block;
  width: 90%;
  max-width: 500px;
  background: #222;
  border-radius: 15px;
  padding: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.6);
  margin-bottom: 15px;
  transition: transform 0.3s, box-shadow 0.3s;
}

.player-wrapper:hover {
  box-shadow: 0 0 25px #e9005a;
  transform: scale(1.02);
}

/* Play / Pause Butonu */
.play-btn {
  display: inline-block;
  cursor: pointer;
  margin-bottom: 15px;
  transition: transform 0.2s;
}

.play-btn:hover {
  transform: scale(1.3);
}

/* SVG kontrol gizli */
audio { display: none; }

/* Progress Bar */
.progress-container {
  width: 100%;
  height: 8px;
  background: #444;
  border-radius: 4px;
  cursor: pointer;
  margin-bottom: 15px;
}

.progress {
  width: 0%;
  height: 100%;
  background: #e9005a;
  border-radius: 4px;
  transition: width 0.2s;
}

/* Volume Slider */
.volume-container {
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 15px;
}

.volume-slider {
  width: 70%;
  cursor: pointer;
  accent-color: #e9005a; /* pembe slider rengi */
}

/* Canlı gösterge */
.live-indicator {
  display: flex;
  flex-direction: column;
  align-items: center;
  font-size: 1.2em;
  font-weight: bold;
}

.live-dot {
  width: 15px;
  height: 15px;
  background-color: #0f0;
  border-radius: 50%;
  animation: blink 1s infinite;
  margin-bottom: 5px;
}

.live-text { color: red; }

@keyframes blink {
  0%,50%,100% { opacity: 1; }
  25%,75% { opacity: 0; }
}

@media (max-width: 600px) {
  h1 { font-size: 2.2em; }
  p { font-size: 1em; }
}
</style>
</head>
<body>

<h1>Delibal FM</h1>
<p>Canlı Yayını Dinlemek İçin Play Tuşuna Basın:</p>

<div class="player-wrapper">
  <div class="play-btn" id="playBtn">
    <!-- Başlangıçta play SVG -->
    <svg id="playIcon" width="50" height="50" viewBox="0 0 24 24" fill="#e9005a" xmlns="http://www.w3.org/2000/svg">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </div>

  <div class="progress-container" id="progressContainer">
    <div class="progress" id="progress"></div>
  </div>

  <div class="volume-container">
    Ses: <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="1">
  </div>

  <audio id="radioAudio">
    <source src="https://radyoserver1.okeylisans.com:8030/live.mp3" type="audio/mpeg">
    Tarayıcınız audio elementini desteklemiyor.
  </audio>
</div>

<div class="live-indicator">
  <div class="live-dot"></div>
  <div class="live-text">Canlı Yayın</div>
</div>

<script>
const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const radioAudio = document.getElementById('radioAudio');
const progress = document.getElementById('progress');
const progressContainer = document.getElementById('progressContainer');
const volumeSlider = document.getElementById('volumeSlider');
let playing = false;

// Oynat / Durdur
playBtn.addEventListener('click', () => {
  if (!playing) {
    radioAudio.play();
    playIcon.setAttribute('fill','#ff4f9c'); // duraklat rengi
  } else {
    radioAudio.pause();
    playIcon.setAttribute('fill','#e9005a'); // play rengi
  }
  playing = !playing;
});

// Progress bar güncelleme
radioAudio.addEventListener('timeupdate', () => {
  const progressPercent = (radioAudio.currentTime / radioAudio.duration) * 100;
  if (!isNaN(progressPercent)) progress.style.width = `${progressPercent}%`;
});

// Progress bar tıklama ile seek
progressContainer.addEventListener('click', (e) => {
  const width = progressContainer.clientWidth;
  const clickX = e.offsetX;
  const duration = radioAudio.duration;
  if (!isNaN(duration)) radioAudio.currentTime = (clickX / width) * duration;
});

// Ses kontrolü
volumeSlider.addEventListener('input', (e) => {
  radioAudio.volume = e.target.value;
});
</script>

</body>
</html>
