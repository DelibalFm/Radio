<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delibal FM • Canlı Yayın</title>

<style>
:root{
  --pink:#ff4fd8;
  --purple:#7a4cff;
  --bg:#0b0614;
  --card:#140b24;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top, #24104a, #05010a 70%);
  font-family:'Segoe UI',sans-serif;
  color:#eee;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

/* ANA KART */
.player{
  width:100%;
  max-width:420px;
  background:linear-gradient(180deg,#1a0f2e,#10071e);
  border-radius:26px;
  padding:30px 26px 34px;
  text-align:center;
  position:relative;
  box-shadow:
    0 0 40px rgba(255,79,216,.25),
    0 0 80px rgba(122,76,255,.15);
}

/* NEON ÇERÇEVE */
.player::before{
  content:'';
  position:absolute;
  inset:-2px;
  border-radius:28px;
  background:linear-gradient(135deg,var(--pink),var(--purple));
  filter:blur(14px);
  opacity:.35;
  z-index:-1;
}

/* LOGO */
h1{
  margin:0 0 6px;
  font-size:2.3em;
  letter-spacing:1px;
  color:#fff;
  text-shadow:0 0 15px rgba(255,79,216,.6);
}

.subtitle{
  opacity:.8;
  font-size:.95em;
  margin-bottom:26px;
}

/* PLAY BUTTON */
.play-btn{
  width:96px;
  height:96px;
  border-radius:50%;
  margin:0 auto 24px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  background:linear-gradient(135deg,var(--pink),var(--purple));
  box-shadow:
    0 0 25px rgba(255,79,216,.7),
    inset 0 0 12px rgba(255,255,255,.25);
  transition:.25s;
}

.play-btn:hover{
  transform:scale(1.08);
}

.play-btn svg{
  width:42px;
  height:42px;
  fill:#12061f;
}

/* VOLUME */
.volume{
  margin-top:10px;
}

.volume label{
  display:block;
  font-size:.85em;
  opacity:.7;
  margin-bottom:8px;
}

.volume input{
  width:100%;
  accent-color:var(--pink);
}

/* LIVE */
.live{
  margin-top:22px;
  font-size:.95em;
  font-weight:600;
  color:#ff3b3b;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.live span{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#ff3b3b;
  box-shadow:0 0 12px #ff3b3b;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%{opacity:1}
  50%{opacity:.3}
  100%{opacity:1}
}

audio{display:none}
</style>
</head>

<body>

<div class="player">

  <h1>Delibal FM</h1>
  <div class="subtitle">Canlı Radyo Yayını</div>

  <div class="play-btn" id="playBtn">
    <svg id="icon" viewBox="0 0 24 24">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </div>

  <div class="volume">
    <label>Ses Seviyesi</label>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
  </div>

  <div class="live">
    <span></span> CANLI YAYIN
  </div>

  <audio id="radio" preload="none" crossorigin="anonymous">
    <source src="https://radyoserver1.okeylisans.com:8030/live.mp3" type="audio/mpeg">
  </audio>

</div>

<script>
const radio = document.getElementById("radio");
const playBtn = document.getElementById("playBtn");
const icon = document.getElementById("icon");
const volume = document.getElementById("volume");

let playing = false;

playBtn.onclick = () => {
  if(!playing){
    radio.play().then(()=>{
      icon.innerHTML =
        '<rect x="6" y="5" width="4" height="14"/>' +
        '<rect x="14" y="5" width="4" height="14"/>';
      playing = true;
    }).catch(()=>{
      alert("Yayın başlatılamadı.");
    });
  }else{
    radio.pause();
    icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    playing = false;
  }
};

volume.oninput = e => radio.volume = e.target.value;
</script>

</body>
</html>
