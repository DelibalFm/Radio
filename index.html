<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delibal FM • Canlı Yayın</title>

<style>
:root{
  --pink:#ff4fd8;
  --purple:#7a4cff;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at top, #24104a, #05010a 70%);
  font-family:'Segoe UI',sans-serif;
  color:#eee;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

/* PLAYER */
.player{
  width:100%;
  max-width:420px;
  background:linear-gradient(180deg,#1a0f2e,#10071e);
  border-radius:26px;
  padding:30px 26px 26px;
  text-align:center;
  position:relative;
  box-shadow:
    0 0 40px rgba(255,79,216,.25),
    0 0 80px rgba(122,76,255,.15);
}

.player::before{
  content:'';
  position:absolute;
  inset:-2px;
  border-radius:28px;
  background:linear-gradient(135deg,var(--pink),var(--purple));
  filter:blur(14px);
  opacity:.35;
  z-index:-1;
}

/* LOGO */
h1{
  margin:0 0 6px;
  font-size:2.3em;
  color:#fff;
  text-shadow:0 0 15px rgba(255,79,216,.6);
}

.subtitle{
  opacity:.8;
  font-size:.95em;
  margin-bottom:26px;
}

/* PLAY */
.play-btn{
  width:96px;
  height:96px;
  border-radius:50%;
  margin:0 auto 24px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  background:linear-gradient(135deg,var(--pink),var(--purple));
  box-shadow:
    0 0 25px rgba(255,79,216,.7),
    inset 0 0 12px rgba(255,255,255,.25);
  transition:.25s;
}

.play-btn:hover{transform:scale(1.08)}
.play-btn svg{width:42px;height:42px;fill:#12061f}

/* VOLUME */
.volume{margin-top:10px}
.volume label{
  display:block;
  font-size:.85em;
  opacity:.7;
  margin-bottom:8px;
}
.volume input{
  width:100%;
  accent-color:var(--pink);
}

/* LIVE */
.live{
  margin-top:24px;
  font-size:1em;
  font-weight:600;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

/* DOT */
.live-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--pink),var(--purple));
  box-shadow:0 0 10px var(--pink),0 0 18px var(--purple);
  animation:pulse 1.2s infinite;
}

/* DJ NAME */
#djName{
  font-weight:800;
  background:linear-gradient(90deg,var(--pink),var(--purple));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:
    0 0 6px rgba(255,79,216,.9),
    0 0 16px rgba(122,76,255,.8),
    0 0 32px rgba(255,79,216,.6);
  animation:neonPulse 2s infinite alternate;
}

/* YAYINDA */
#onAir{
  font-weight:700;
  color:#fff;
  text-shadow:
    0 0 6px rgba(255,255,255,.8),
    0 0 14px rgba(255,79,216,.7),
    0 0 26px rgba(122,76,255,.6);
  animation:onairPulse 1.8s infinite alternate;
}

/* SONG */
.song{
  margin-top:14px;
  font-size:.95em;
  font-weight:700;
  background:linear-gradient(90deg,var(--pink),var(--purple));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:
    0 0 6px rgba(255,79,216,.7),
    0 0 16px rgba(122,76,255,.7),
    0 0 28px rgba(255,79,216,.5);
  animation:neonPulse 2s infinite alternate;
}

/* FOOTER */
.footer{
  margin-top:18px;
  font-size:.7em;
  opacity:.45;
}

/* ANIM */
@keyframes pulse{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
@keyframes neonPulse{from{opacity:.85}to{opacity:1}}
@keyframes onairPulse{from{opacity:.7}to{opacity:1}}

audio{display:none}
</style>
</head>

<body>

<div class="player">

  <h1>Delibal FM</h1>
  <div class="subtitle">Canlı Radyo Yayını</div>

  <div class="play-btn" id="playBtn">
    <svg id="icon" viewBox="0 0 24 24">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </div>

  <div class="volume">
    <label>Ses Seviyesi</label>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
  </div>

  <div class="live">
    <div class="live-dot"></div>
    <span id="djName">Yükleniyor...</span>
    <span id="onAir">YAYINDA</span>
  </div>

  <div class="song">
    <span id="songTitle">Şarkı yükleniyor...</span>
  </div>

  <div class="footer">
    © 2026 Delibal FM • Tüm yayın hakları saklıdır.
  </div>

  <audio id="radio" preload="none">
    <source src="https://radyoserver1.okeylisans.com:8030/live.mp3" type="audio/mpeg">
  </audio>

</div>

<script>
const radio = document.getElementById("radio");
const playBtn = document.getElementById("playBtn");
const icon = document.getElementById("icon");
const volume = document.getElementById("volume");

let playing = false;

playBtn.onclick = () => {
  if(!playing){
    radio.play();
    icon.innerHTML =
      '<rect x="6" y="5" width="4" height="14"/>' +
      '<rect x="14" y="5" width="4" height="14"/>';
    playing = true;
  }else{
    radio.pause();
    icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    playing = false;
  }
};

volume.oninput = e => radio.volume = e.target.value;

/* 🔥 CANLI DJ */
async function loadDJ(){
  try{
    const res = await fetch("dj.txt?cache=" + Date.now());
    const name = await res.text();
    document.getElementById("djName").innerText = name.trim();
  }catch(e){}
}

/* 🎵 CANLI ŞARKI (SonicPanel / Icecast) */
async function loadSong(){
  try{
    const res = await fetch(
      "https://radyoserver1.okeylisans.com:8030/status-json.xsl",
      { cache: "no-store" }
    );

    const data = await res.json();
    let source = data.icestats.source;

    if (Array.isArray(source)) {
      source = source.find(s => s.listenurl.includes("8030"));
    }

    document.getElementById("songTitle").innerText =
      source?.title || "Şarkı bilgisi yok";

  }catch(e){
    document.getElementById("songTitle").innerText =
      "Şarkı bilgisi alınamadı";
  }
}

loadDJ();
loadSong();
setInterval(loadDJ, 5000);
setInterval(loadSong, 5000);
</script>

</body>
</html>
