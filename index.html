<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Delibal FM | Canlı Radyo</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Delibal FM Canlı Radyo Yayını">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#fff;
  display:flex;
  flex-direction:column;
}

header{
  padding:20px;
  text-align:center;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(6px);
}

header h1{
  font-size:2.2rem;
  font-weight:600;
}

header p{
  opacity:.8;
  margin-top:5px;
}

main{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px;
}

.player{
  background:rgba(255,255,255,.08);
  border-radius:22px;
  padding:30px;
  max-width:420px;
  width:100%;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,.45);
}

.player h2{
  font-weight:500;
  margin-bottom:10px;
}

.live{
  color:#00ff9d;
  font-size:.9rem;
  margin-bottom:20px;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:20px;
}

button{
  border:none;
  border-radius:50px;
  padding:14px 30px;
  font-size:1rem;
  font-weight:600;
  cursor:pointer;
  background:#00ff9d;
  color:#000;
  transition:.25s;
}

button:hover{
  background:#00d987;
  transform:scale(1.05);
}

.status{
  margin-top:15px;
  font-size:.85rem;
  opacity:.85;
}

footer{
  padding:15px;
  text-align:center;
  font-size:.85rem;
  opacity:.65;
}

@media(max-width:480px){
  header h1{font-size:1.8rem;}
  .player{padding:22px;}
}
</style>
</head>

<body>

<header>
  <h1>Delibal FM</h1>
  <p>Canlı Radyo Yayını</p>
</header>

<main>
  <div class="player">
    <h2>Şimdi Yayında</h2>
    <div class="live">🔴 CANLI</div>

    <!-- RADYO PLAYER -->
    <audio id="radio" preload="none" crossorigin="anonymous">
      <source src="https://radyoserver1.okeylisans.com:8030/;" type="audio/mpeg">
    </audio>

    <div class="buttons">
      <button onclick="playRadio()">▶ Play</button>
      <button onclick="stopRadio()">⏸ Stop</button>
    </div>

    <div class="status" id="status">Hazır</div>
  </div>
</main>

<footer>
  © 2026 Delibal FM • Tüm Hakları Saklıdır
</footer>

<script>
const radio = document.getElementById("radio");
const statusText = document.getElementById("status");

function playRadio(){
  radio.play().then(() => {
    statusText.innerText = "Yayın Çalıyor";
  }).catch(err => {
    statusText.innerText = "Tarayıcı yayını engelledi";
    console.error(err);
    alert("Yayın başlatılamadı.\nTarayıcı veya stream kaynaklı olabilir.");
  });
}

function stopRadio(){
  radio.pause();
  radio.currentTime = 0;
  statusText.innerText = "Durduruldu";
}
</script>

</body>
</html>
